[workspace]
members = ["crates/windlass", "crates/windlass-contract", "crates/windlass-bench"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
license = "MIT"

[workspace.dependencies]
windlass = { path = "crates/windlass" }
windlass-contract = { path = "crates/windlass-contract" }
libc = "=0.2.175"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(windlass_backend, values("kqueue", "epoll", "iocp", "wasi_p2", "wasi_p3", "web", "unsupported"))'] }

[profile.release]
codegen-units = 1

[profile.bench]
codegen-units = 1
