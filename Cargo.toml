[workspace]
members = ["crates/*", "protocols/*"]
exclude = ["spikes/*"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/PerryTS/turnloop"

[workspace.dependencies]
turnloop-io = { path = "crates/turnloop-io", version = "0.1.0-alpha.1" }
turnloop-wasi-random = { path = "crates/turnloop-wasi-random", version = "0.1.0-alpha.1" }
turnloop = { path = "crates/turnloop", version = "0.1.0-alpha.1" }
turnloop-contract = { path = "crates/turnloop-contract", version = "0.1.0-alpha.1" }
libc = "=0.2.175"
futures-io = "=0.3.31"

bytes = "1.11"
postgres-protocol = "=0.6.12"
mysql_common = { version = "=0.38.2", default-features = false }
bson = { version = "=3.1.0", default-features = false, features = ["compat-3-0-0", "serde", "serde_json-1"] }
base64 = "0.22"
sha1 = "0.11"
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = "0.13"
md-5 = "0.11"
stringprep = "0.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Keep lettre's encoding helper on the shared base64 0.22 API used by the DB codecs.
email-encoding = "=0.4.1"
lettre = { version = "0.11.23", default-features = false, features = ["builder"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
getrandom = "0.4"
loom = "=0.7.2"
gungraun = "=0.19.4"
turnloop-tls = { path = "protocols/turnloop-tls", version = "0.1.0-alpha.1" }
turnloop-http = { path = "protocols/turnloop-http", version = "0.1.0-alpha.1" }
turnloop-zstd-decoder = { path = "protocols/turnloop-zstd-decoder", version = "0.1.0-alpha.1" }
http = "1"
url = "2"
httparse = "1"
brotli = "8"
percent-encoding = "2"
webpki-roots = "1"
ring = "0.17"
rustls-pki-types = "1"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
zstd = { version = "0.13", default-features = false }
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }
fastrand = "2"
rand = { version = "0.8", features = ["small_rng"] }
criterion = { version = "0.5", default-features = false }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(turnloop_backend, values("kqueue", "epoll", "iocp", "wasi_p2", "wasi_p3", "web", "unsupported"))'] }

[profile.release]
codegen-units = 1

[profile.bench]
codegen-units = 1
