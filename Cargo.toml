[workspace]
members = ["crates/*", "protocols/*"]
exclude = ["spikes/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
repository = "https://github.com/PerryTS/turnloop"

[workspace.dependencies]
turnloop = { path = "crates/turnloop", version = "0.1.0" }
turnloop-contract = { path = "crates/turnloop-contract", version = "0.1.0" }
libc = "=0.2.175"

bytes = "1.11"
postgres-protocol = "=0.6.12"
mysql_common = { version = "=0.38.2", default-features = false }
bson = { version = "=3.1.0", default-features = false, features = ["compat-3-0-0", "serde", "serde_json-1"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
md-5 = "0.10"
stringprep = "0.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
lettre = { version = "0.11.23", default-features = false, features = ["builder"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
serde_json = "1"
getrandom = "0.4"
loom = "=0.7.2"
iai-callgrind = "=0.16.1"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(loom)', 'cfg(turnloop_backend, values("kqueue", "epoll", "iocp", "wasi_p2", "wasi_p3", "web", "unsupported"))'] }

[profile.release]
codegen-units = 1

[profile.bench]
codegen-units = 1
