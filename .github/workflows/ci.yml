name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      record_baselines:
        description: Record Linux instruction baselines for review
        type: boolean
        default: false
permissions: {}
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
  queue: ${{ github.event_name == 'pull_request' && 'single' || 'max' }}
defaults:
  run:
    shell: bash
env:
  CARGO_TERM_COLOR: always
  CC_wasm32_wasip2: clang
  AR_wasm32_wasip2: llvm-ar
  CC_wasm32_wasip3: clang
  AR_wasm32_wasip3: llvm-ar
  CC_wasm32_unknown_unknown: clang
  AR_wasm32_unknown_unknown: llvm-ar
  RUST_BACKTRACE: '1'
jobs:
  workflow-lint:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - name: Install checksum-pinned linters
        run: python3 scripts/ci/install-tools.py actionlint zizmor shellcheck
      - name: Lint automation and exercise gate failures
        run: |
          python3 scripts/ci/lint-workflows.py
          python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
  lint-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt,clippy
      - name: Formatting and unsafe-aware Clippy
        run: |
          cargo +nightly-2026-08-20 fmt --all --check
          cargo +nightly-2026-08-20 clippy --locked --workspace --all-targets -- -D warnings -D clippy::undocumented_unsafe_blocks
          cargo +nightly-2026-08-20 clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks
      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +nightly-2026-08-20 doc --locked --workspace --all-features --no-deps
      - name: Resolve with the pinned soak policy, then check stable
        run: |
          cargo +nightly-2026-08-20 metadata --locked --all-features --format-version 1 > /dev/null
          rustup toolchain install stable --profile minimal
          cargo +stable check --locked --workspace --all-targets --all-features
      - name: Declared MSRV
        run: |
          rustup toolchain install 1.97.1 --profile minimal
          cargo +1.97.1 check --locked --workspace --all-targets --all-features
  lint-wasm:
    strategy:
      fail-fast: false
      matrix:
        target: [wasm32-wasip2, wasm32-unknown-unknown]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt,clippy
      - name: Cross-target Clippy and stable
        run: |
          rustup target add --toolchain nightly-2026-08-20 "$TARGET"
          cargo +nightly-2026-08-20 clippy --locked --workspace --all-targets --target "$TARGET" --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks
          rustup toolchain install stable --profile minimal --target "$TARGET"
          cargo +stable check --locked --workspace --all-targets --all-features --target "$TARGET"
  # PENDING Windows shared contracts until the IOCP production provider lands (wave 2).
  test-native:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, windows-2025]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt,clippy
      - name: Workspace and single-threaded contracts, default and all features
        run: python3 scripts/ci/run-tests.py native
      - name: HTTP, TLS and WebSocket Node/curl interop
        run: python3 scripts/test-servers.py --services http run python3 scripts/ci/run-tests.py interop
      - name: Portable timer benchmark with workload assertions
        run: cargo +nightly-2026-08-20 run --release -p turnloop-bench --locked -- --portable --timers
  self-hosted-windows:
    if: vars.SELF_HOSTED_WINDOWS == 'true'
    # zizmor: ignore[self-hosted-runner] -- Owner-enabled, ephemeral isolated Windows runner required by the platform contract.
    runs-on: [self-hosted, Windows, X64, turnloop-windows]
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt,clippy
      - name: Native Windows lint and contracts
        run: |
          cargo +nightly-2026-08-20 clippy --locked --workspace --all-targets --all-features -- -D warnings -D clippy::undocumented_unsafe_blocks
          python3 scripts/ci/run-tests.py native
  # PENDING wave 2: integrate WASI providers and nonzero shared contracts; retain failing gate.
  wasi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-wasip2
            toolchain: nightly-2026-08-20
          - target: wasm32-wasip3
            toolchain: nightly-2026-09-07
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    env:
      TARGET: ${{ matrix.target }}
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install the backend's pinned toolchain and Wasmtime 46
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --component clippy --target "$TARGET"
          bash scripts/ci/install-wasmtime.sh
      - name: Lint and run actual WASI contracts
        run: |
          cargo +"$TOOLCHAIN" clippy --locked --workspace --all-targets --all-features --target "$TARGET" -- -D warnings -D clippy::undocumented_unsafe_blocks
          python3 scripts/ci/run-tests.py wasi --target "$TARGET"
  # PENDING wave 2: add browser/Node contract targets and metadata, then run both browsers.
  web:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt,clippy
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - name: Prepare browser test tools
        run: |
          rustup target add --toolchain nightly-2026-08-20 wasm32-unknown-unknown
          python3 scripts/ci/install-tools.py wasm-pack
          google-chrome --version
          firefox --version
      - name: Chrome and Firefox contracts
        run: python3 scripts/ci/run-tests.py web
      - name: Node subset
        run: python3 scripts/ci/run-tests.py node
  protocol:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16.13
        env:
          POSTGRES_DB: turnloop
          POSTGRES_USER: turnloop
          POSTGRES_PASSWORD: turnloop # zizmor: ignore[hardcoded-container-credentials] -- Disposable CI database credential, never a repository secret.
          POSTGRES_HOST_AUTH_METHOD: scram-sha-256
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U turnloop -d turnloop"
          --health-interval 5s --health-timeout 5s --health-retries 30
      mysql:
        image: mysql:9.6.0
        env:
          MYSQL_DATABASE: turnloop
          MYSQL_USER: turnloop
          MYSQL_PASSWORD: turnloop # zizmor: ignore[hardcoded-container-credentials] -- Disposable CI database credential.
          MYSQL_ROOT_PASSWORD: turnloop-root # zizmor: ignore[hardcoded-container-credentials] -- Disposable CI database credential.
        ports: ['3306:3306']
        options: >-
          --health-cmd "mysql --host=127.0.0.1 --user=turnloop --password=turnloop --execute 'SELECT 1'"
          --health-interval 5s --health-timeout 5s --health-retries 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.5.1'
          package-manager-cache: false
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt,clippy
      - name: Install private fixture build dependencies and SMTP sink
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update
          sudo --preserve-env=DEBIAN_FRONTEND apt-get install --yes postfix build-essential libssl-dev pkg-config
      - name: Cache pinned Redis TLS build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/redis-build
          key: redis-tls-ubuntu-24.04-${{ runner.arch }}-${{ hashFiles('scripts/ci/install-redis.py') }}
      - name: Install and verify Redis 8.4.0 with TLS
        run: python3 scripts/ci/install-redis.py
      - name: Pull MongoDB before the bounded fixture startup wait
        run: docker pull mongo:8
      - name: Required real-server protocol suites with the shared fixture contract
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: scripts/test-servers.py --ci-services run python3 scripts/ci/run-tests.py protocol
      - name: Fixture logs and cleanup
        if: always()
        run: scripts/test-servers.py --ci-services stop
      - name: SQL service container logs on failure
        if: failure()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          MYSQL_CONTAINER: ${{ job.services.mysql.id }}
        run: |
          mkdir -p .tools/protocol-logs
          status=0
          docker logs "$POSTGRES_CONTAINER" 2>&1 | tee .tools/protocol-logs/postgres-container.log || status=1
          docker logs "$MYSQL_CONTAINER" 2>&1 | tee .tools/protocol-logs/mysql-container.log || status=1
          exit "$status"
      - name: Collect private server logs without traversing data directories
        if: always()
        run: scripts/test-servers.py logs
      - name: Preserve private server diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: protocol-server-logs
          path: .tools/protocol-logs/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7

  h2spec:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-20 --profile minimal
      - name: Build verified h2spec source and run every strict test
        run: python3 scripts/ci/h2spec.py
  protocol-wasi:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: wasm32-wasip2
            toolchain: nightly-2026-08-20
          - target: wasm32-wasip3
            toolchain: nightly-2026-09-07
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      TARGET: ${{ matrix.target }}
      TOOLCHAIN: ${{ matrix.toolchain }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned Rust and Wasmtime
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal --target "$TARGET"
          bash scripts/ci/install-wasmtime.sh
      - name: Execute HTTP codecs and all streaming allocation gates
        run: python3 scripts/ci/run-tests.py protocol-wasi --target "$TARGET"

  dependencies:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt,clippy
      - name: Install audit tools and p3 compiler
        run: |
          python3 scripts/ci/install-tools.py cargo-deny
          rustup toolchain install nightly-2026-09-07 --profile minimal
      - name: Seven-day dependency soak (including already locked versions)
        run: python3 scripts/ci/soak.py
      - name: Zero tokio or other async runtime on every target
        run: bash scripts/ci/no-tokio.sh
      - name: Advisories, bans, licenses and sources
        run: cargo +nightly-2026-08-20 deny --locked check advisories bans licenses sources
  loom:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 30
    env:
      RUSTFLAGS: --cfg loom
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt,clippy
      - name: Model-check production notifier, queue and pool paths
        run: python3 scripts/ci/run-tests.py loom
  miri:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned Miri
        run: |
          rustup toolchain install nightly-2026-08-20 --profile minimal --component miri,rust-src
          cargo +nightly-2026-08-20 miri setup
      - name: Check core's explicitly marked pure-Rust tests
        run: python3 scripts/ci/run-tests.py miri
  # Compare against the committed Ubuntu 24.04 x86_64 instruction baseline.
  instructions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Install pinned Rust
        run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt,clippy
      - name: Install Valgrind and matching gungraun runner
        run: |
          sudo apt-get update
          sudo apt-get install --yes valgrind
          python3 scripts/ci/install-tools.py gungraun-runner
      - name: Three fresh-process instruction counts against reviewed baselines
        env:
          RECORD_BASELINES: ${{ github.event_name == 'workflow_dispatch' && inputs.record_baselines }}
        run: |
          if [[ "$RECORD_BASELINES" == "true" ]]; then
            python3 scripts/ci/instructions.py --record-baselines
          else
            python3 scripts/ci/instructions.py
          fi
      - name: Upload measured baseline candidates, including missing-baseline failures
        if: ${{ !cancelled() && hashFiles('.tools/instruction-baselines/measurements.json') != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: instruction-baselines
          path: .tools/instruction-baselines/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
  ci-gate:
    name: ci-gate
    if: always()
    needs: [workflow-lint, lint-native, lint-wasm, test-native, self-hosted-windows, wasi, web, protocol, h2spec, protocol-wasi, dependencies, loom, miri, instructions]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14'
      - name: Reject failures, cancellations and unexpected skips
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          SELF_HOSTED_WINDOWS: ${{ vars.SELF_HOSTED_WINDOWS }}
        run: python3 scripts/ci/ci-gate.py
