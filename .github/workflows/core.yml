name: Core contracts
on: [push, pull_request]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly-2026-08-20 --profile minimal --component rustfmt,clippy
      - run: cargo +nightly-2026-08-20 fmt --all -- --check
      - run: cargo +nightly-2026-08-20 clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo +nightly-2026-08-20 test --workspace --locked
      - name: Linux timerfd fallback
        if: runner.os == 'Linux'
        run: cargo +nightly-2026-08-20 test --workspace --locked --features turnloop/epoll-timerfd
      - name: BTreeMap comparison and production allocation gate
        run: cargo +nightly-2026-08-20 test --workspace --locked --all-features
      - name: Loom models
        run: RUSTFLAGS='--cfg loom' cargo +nightly-2026-08-20 test -p turnloop --locked models -- --test-threads=1
      - name: Portable benchmark fallback
        run: cargo +nightly-2026-08-20 run --release -p turnloop-bench --locked -- --portable --timers
      - run: rustup toolchain install stable --profile minimal
      - name: Stable check against the soaked lockfile
        run: cargo +stable check --workspace --locked
  portable-core:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        target: [x86_64-pc-windows-msvc, wasm32-wasip2, wasm32-unknown-unknown]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: rustup toolchain install nightly-2026-08-20 --profile minimal --component clippy --target ${{ matrix.target }}
      - run: cargo +nightly-2026-08-20 clippy --workspace --all-targets --locked --target ${{ matrix.target }} -- -D warnings
