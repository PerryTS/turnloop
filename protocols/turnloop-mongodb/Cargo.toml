[package]
name = "turnloop-mongodb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["event-loop", "networking", "sans-io"]
categories = ["network-programming", "asynchronous"]
documentation = "https://docs.rs/turnloop-mongodb"
description = "Host-driven, sans-IO MongoDB protocol state machines"

[dependencies]
turnloop-tls = { workspace = true, optional = true, features = ["turnloop"] }
turnloop-io = { workspace = true, optional = true }
bson.workspace = true
base64.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
pbkdf2.workspace = true
md-5.workspace = true
stringprep.workspace = true
flate2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rustls.workspace = true

[dev-dependencies]
serde_json.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true

[package.metadata.turnloop-ci]
role = "protocol"
integration-tests = ["real_mongodb"]

[target.'cfg(all(target_os = "wasi", target_env = "p3"))'.dependencies]
turnloop-io = { workspace = true, optional = true, features = ["wasi-p3-experimental"] }
turnloop-wasi-random.workspace = true

[features]
turnloop = ["dep:turnloop-io", "dep:turnloop-tls"]
