[package]
name = "turnloop-mongodb"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
description = "Host-driven, sans-IO MongoDB protocol state machines"

[dependencies]
bson = { version = "=3.1.0", default-features = false, features = ["compat-3-0-0", "serde", "serde_json-1"] }
base64 = "0.22"
sha1 = "0.10"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = "0.12"
md-5 = "0.10"
stringprep = "0.1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }

[dev-dependencies]
serde_json = "1"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-pemfile = "2"
