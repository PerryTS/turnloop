[package]
name = "turnloop-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Sans-I/O HTTP/1.1 and HTTP/2 client and server protocols"
readme = "README.md"
keywords = ["networking", "sans-io", "http"]
categories = ["network-programming"]
documentation = "https://docs.rs/turnloop-http"

[features]
pure-rust-zstd = ["dep:turnloop-zstd-decoder"]

[dependencies]
turnloop-zstd-decoder = { workspace = true, optional = true }
bytes.workspace = true
http.workspace = true
url.workspace = true
httparse.workspace = true
flate2.workspace = true
brotli.workspace = true
base64.workspace = true
percent-encoding.workspace = true
turnloop-tls.workspace = true

[dev-dependencies]
rcgen.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
zstd.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
turnloop-zstd-decoder.workspace = true

[lints]
workspace = true

[package.metadata.turnloop-ci]
role = "protocol"
service-group = "http"
integration-tests = ["interop"]
wasi-tests = ["codecs", "allocations"]

[[test]]
name = "allocations"
harness = false
