[package]
name = "turnloop-smtp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["event-loop", "networking", "sans-io"]
categories = ["network-programming", "asynchronous"]
documentation = "https://docs.rs/turnloop-smtp"
description = "Pull-driven SMTP client and MIME message builder"

[dependencies]
turnloop-tls = { workspace = true, optional = true, features = ["turnloop"] }
turnloop-io = { workspace = true, optional = true }
base64.workspace = true
lettre.workspace = true
# Constrain lettre's compatible helper to the workspace's shared base64 version.
email-encoding.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rustls.workspace = true

[lints]
workspace = true

[package.metadata.turnloop-ci]
role = "protocol"
integration-tests = ["smtp"]

[features]
turnloop = ["dep:turnloop-io", "dep:turnloop-tls"]

[target.'cfg(all(target_os = "wasi", target_env = "p3"))'.dependencies]
turnloop-io = { workspace = true, optional = true, features = ["wasi-p3-experimental"] }
