[package]
name = "turnloop-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unbuffered sans-I/O TLS with host-supplied time"
readme = "README.md"
keywords = ["networking", "sans-io", "tls"]
categories = ["network-programming"]
documentation = "https://docs.rs/turnloop-tls"

[dependencies]
rustls.workspace = true
webpki-roots.workspace = true

[dev-dependencies]
rcgen.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ring = { workspace = true, features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { workspace = true, features = ["web"] }

[lints]
workspace = true

[package.metadata.turnloop-ci]
role = "protocol"
service-group = "http"
integration-tests = ["tls"]
wasi-tests = ["portable"]

[[test]]
name = "portable"
harness = false
