[package]
name = "turnloop-tls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Unbuffered sans-I/O TLS with host-supplied time"
readme = "README.md"
keywords = ["networking", "sans-io", "tls"]
categories = ["network-programming"]
documentation = "https://docs.rs/turnloop-tls"

[features]
default = ["ring"]
turnloop = ["dep:turnloop-io"]
# The default crypto provider and the RFC 5929 hash. Disable default features and
# pass a provider (or install a rustls process default) to link only that one.
ring = ["dep:ring", "rustls/ring"]

[dependencies]
turnloop-io = { workspace = true, optional = true }

# Not the workspace rustls entry, which enables ring for every member.
rustls = { version = "0.23", default-features = false, features = ["std", "tls12"] }
ring = { workspace = true, optional = true }
webpki-roots.workspace = true

[dev-dependencies]
rcgen.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
ring = { workspace = true, optional = true, features = ["wasm32_unknown_unknown_js"] }
rustls-pki-types = { workspace = true, features = ["web"] }

[lints]
workspace = true

[package.metadata.turnloop-ci]
role = "protocol"
service-group = "http"
integration-tests = ["tls", "upgrade", "asynchronous", "async_allocations"]
wasi-tests = ["asynchronous", "async_allocations", "portable", "channel_binding"]

[[test]]
name = "portable"
harness = false

[[test]]
name = "asynchronous"
required-features = ["turnloop"]

[[test]]
name = "upgrade"
required-features = ["turnloop"]

[target.'cfg(all(target_os = "wasi", target_env = "p3"))'.dependencies]
turnloop-io = { workspace = true, optional = true, features = ["wasi-p3-experimental"] }

[[test]]
name = "async_allocations"
harness = false
required-features = ["turnloop"]
