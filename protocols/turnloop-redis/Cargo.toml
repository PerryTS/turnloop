[package]
name = "turnloop-redis"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["event-loop", "networking", "sans-io"]
categories = ["network-programming", "asynchronous"]
documentation = "https://docs.rs/turnloop-redis"
description = "Pull-driven RESP Redis client, cluster and Sentinel protocols"

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rustls.workspace = true

[lints]
workspace = true

[package.metadata.turnloop-ci]
role = "protocol"
wasi-tests = ["asynchronous"]
integration-tests = ["real", "async_server"]

[features]
turnloop = ["dep:turnloop-io", "dep:turnloop-tls"]

[dependencies]
turnloop-tls = { workspace = true, optional = true, features = ["turnloop"] }
turnloop-io = { workspace = true, optional = true }

[target.'cfg(all(target_os = "wasi", target_env = "p3"))'.dependencies]
turnloop-io = { workspace = true, optional = true, features = ["wasi-p3-experimental"] }

[[test]]
name = "asynchronous"
required-features = ["turnloop"]

[[test]]
name = "async_server"
required-features = ["turnloop"]
