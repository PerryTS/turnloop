[package]
name = "turnloop-postgres"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["event-loop", "networking", "sans-io"]
categories = ["network-programming", "asynchronous"]
documentation = "https://docs.rs/turnloop-postgres"
description = "Pull-driven sans-I/O PostgreSQL client protocol"

[dependencies]
bytes.workspace = true
postgres-protocol.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rustls.workspace = true


[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
postgres-protocol = { workspace = true, features = ["js"] }

[lints]
workspace = true

[package.metadata.turnloop-ci]
role = "protocol"
integration-tests = ["server"]

[dev-dependencies]
sha2.workspace = true
