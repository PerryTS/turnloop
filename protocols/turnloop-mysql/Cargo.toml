[package]
name = "turnloop-mysql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["event-loop", "networking", "sans-io"]
categories = ["network-programming", "asynchronous"]
documentation = "https://docs.rs/turnloop-mysql"
description = "Pull-driven sans-I/O MySQL client protocol"

[dependencies]
bytes.workspace = true
mysql_common.workspace = true
flate2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rustls.workspace = true


[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true

[package.metadata.turnloop-ci]
role = "protocol"
integration-tests = ["server"]

[target.'cfg(all(target_os = "wasi", target_env = "p3"))'.dependencies]
turnloop-wasi-random.workspace = true
