[package]
name = "turnloop-mysql"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["event-loop", "networking", "sans-io"]
categories = ["network-programming", "asynchronous"]
documentation = "https://docs.rs/turnloop-mysql"
description = "Pull-driven sans-I/O MySQL client protocol"

[dependencies]
turnloop-tls = { workspace = true, optional = true, features = ["turnloop"] }
turnloop-io = { workspace = true, optional = true }
bytes.workspace = true
mysql_common.workspace = true
flate2.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rustls.workspace = true


[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
getrandom = { workspace = true, features = ["wasm_js"] }

[lints]
workspace = true

[package.metadata.turnloop-ci]
role = "protocol"
wasi-tests = ["asynchronous"]
wasi-integration-tests = ["async_server"]
integration-tests = ["server", "async_server"]

[target.'cfg(all(target_os = "wasi", target_env = "p3"))'.dependencies]
turnloop-io = { workspace = true, optional = true, features = ["wasi-p3-experimental"] }
turnloop-wasi-random.workspace = true

[features]
turnloop = ["dep:turnloop-io", "dep:turnloop-tls"]

[[test]]
name = "asynchronous"
required-features = ["turnloop"]

[[test]]
name = "async_server"
required-features = ["turnloop"]

[[example]]
name = "turnloop"
required-features = ["turnloop"]
