# DESIGN.md draft 0.3 §5b: zero async runtimes, with no exceptions.
[targets]
triples = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin", "x86_64-pc-windows-msvc",
  "wasm32-wasip2", "wasm32-wasip3", "wasm32-unknown-unknown",
  "wasm32-wasip1-threads",
]

# Remove as soon as the exact registry timestamp has completed its seven-day soak.
[[security-exceptions]]
crate = "rustls"
version = "0.23.45"
advisory = "RUSTSEC-2026-0285"
reason = "Fix TLS 1.3 handshake messages accepted across encryption-level boundaries"
expires = 2026-09-21
