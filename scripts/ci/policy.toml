# DESIGN.md draft 0.3 §5b: zero async runtimes, with no exceptions.
[targets]
triples = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin", "x86_64-pc-windows-msvc",
  "wasm32-wasip2", "wasm32-wasip3", "wasm32-unknown-unknown",
  "wasm32-wasip1-threads", "all",
]

[dependencies]
banned = [
  "tokio", "tokio-util", "hyper", "h2", "async-std", "smol", "async-io",
  "async-executor", "async-global-executor", "futures-executor", "futures-runtime",
  "http-body", "http-body-util",
]

# Reviewed security fixes: reject distrusted emSign intermediates and remove
# their trust anchor. Registry checksums and all other dependency ages still
# apply. Expiries equal each exact release's publication date plus seven days.
[[security-exceptions]]
crate = "rustls-webpki"
version = "0.103.16"
advisory = "RUSTSEC-2026-0382"
reason = "Reject distrusted intermediate public keys; upstream rustls/webpki#546. Published 2026-10-20T08:58:28Z; normal soak resumes 2026-10-27T08:58:28Z."
expires = 2026-10-27

[[security-exceptions]]
crate = "webpki-roots"
version = "1.0.10"
advisory = "RUSTSEC-2026-0381"
reason = "Remove the distrusted emSign ECC Root CA - G3; upstream rustls/webpki-roots#133. Published 2026-10-19T20:11:32Z; normal soak resumes 2026-10-26T20:11:32Z."
expires = 2026-10-26
