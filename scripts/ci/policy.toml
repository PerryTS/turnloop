# DESIGN.md draft 0.3 §5b: zero async runtimes, with no exceptions.
[targets]
triples = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin", "x86_64-pc-windows-msvc",
  "wasm32-wasip2", "wasm32-wasip3", "wasm32-unknown-unknown",
  "wasm32-wasip1-threads", "all",
]

[dependencies]
banned = [
  "tokio", "tokio-util", "hyper", "h2", "async-std", "smol", "async-io",
  "async-executor", "async-global-executor", "futures-executor", "futures-runtime",
  "http-body", "http-body-util",
]
