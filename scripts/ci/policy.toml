# DESIGN.md draft 0.3 §5b: zero async runtimes, with no exceptions.
[targets]
triples = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin", "x86_64-pc-windows-msvc",
  "wasm32-wasip2", "wasm32-wasip3", "wasm32-unknown-unknown",
  "wasm32-wasip1-threads", "all",
]

[dependencies]
banned = [
  "tokio", "tokio-util", "hyper", "h2", "async-std", "smol", "async-io",
  "async-executor", "async-global-executor", "futures-executor", "futures-runtime",
  "http-body", "http-body-util",
]

# Owner-approved (2026-10-16) one-time soak exception: rustls 0.23.46 fixes
# RUSTSEC-2026-0346/0347/0348/0349 against 0.23.45. Expires when the release
# completes its 7-day soak (published 2026-10-14).
[[security-exceptions]]
crate = "rustls"
version = "0.23.46"
advisory = "RUSTSEC-2026-0346"
reason = "rustls 0.23.46 fixes RUSTSEC-2026-0346, -0347, -0348 and -0349 in 0.23.45 (TLS secrets in Debug, ECH rejection data leak, brotli cert decompression DoS, ServerHello KX downgrade)"
expires = 2026-10-21
