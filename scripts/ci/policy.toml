# DESIGN.md draft 0.3 §5b: zero async runtimes, with no exceptions.
[targets]
triples = [
  "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu",
  "aarch64-apple-darwin", "x86_64-pc-windows-msvc",
  "wasm32-wasip2", "wasm32-wasip3", "wasm32-unknown-unknown",
  "wasm32-wasip1-threads", "all",
]

[dependencies]
banned = [
  "tokio", "tokio-util", "hyper", "h2", "async-std", "smol", "async-io",
  "async-executor", "async-global-executor", "futures-executor", "futures-runtime",
  "http-body", "http-body-util",
]

# Exact security fixes; each exception stops at registry publication + seven days.
[[security-exceptions]]
crate = "ctutils"
version = "0.4.4"
advisory = "RUSTSEC-2026-0385"
reason = "Patched constant-time mask generation and u128 comparisons"
expires = 2026-10-30

[[security-exceptions]]
crate = "rustls-webpki"
version = "0.103.16"
advisory = "RUSTSEC-2026-0382"
reason = "Reject distrusted emSign intermediate public keys"
expires = 2026-10-27

[[security-exceptions]]
crate = "webpki-roots"
version = "1.0.10"
advisory = "RUSTSEC-2026-0381"
reason = "Remove the distrusted emSign root from bundled roots"
expires = 2026-10-26
