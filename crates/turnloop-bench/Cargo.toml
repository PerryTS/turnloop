[package]
name = "turnloop-bench"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
timer-btree = []

[dependencies]
turnloop.workspace = true
turnloop-contract.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[lints]
workspace = true

[package.metadata.turnloop-ci]
role = "bench"
instruction-baseline = "benchmarks/instructions.json"
instruction-controls = ["instructions::operations::control"]
instruction-cases = [
    "instructions::operations::control",
    "instructions::operations::idle",
    "instructions::operations::notify",
    "instructions::operations::timer_cancel",
]

[target.'cfg(target_os = "linux")'.dev-dependencies]
gungraun.workspace = true

[[bench]]
name = "instructions"
harness = false
