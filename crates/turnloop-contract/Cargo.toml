[package]
name = "turnloop-contract"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[features]
executor = ["turnloop/executor", "dep:futures-io"]

[dependencies]
turnloop.workspace = true
futures-io = { workspace = true, optional = true }

[lints]
workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_System_Threading", "Win32_System_Console", "Win32_Storage_FileSystem", "Win32_Security", "Win32_System_IO", "Win32_System_Pipes"] }

[package.metadata.turnloop-ci]
role = "contract"

[[bin]]
name = "native_child"
path = "src/bin/native_child.rs"
test = false
bench = false
