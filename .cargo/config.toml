# Supply-chain soak, same window as Perry (SOAK_DAYS = 7). Crates published less than 7 days ago are not resolved
# unless already in Cargo.lock.
[unstable]
min-publish-age = true

[registry]
global-min-publish-age = "7 days"

# BSON's rand 0.9 still uses getrandom 0.3 (no built-in p3 backend).
# turnloop-wasi-random supplies the single symbol used by both 0.3 and 0.4.
[target.wasm32-wasip3]
rustflags = ['--cfg', 'getrandom_backend="custom"']
